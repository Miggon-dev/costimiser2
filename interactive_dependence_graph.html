function childStillNeeded(childId) {
    const parentSeparators =
        separatorsByChild[childId] || [];

    for (const separatorId of parentSeparators) {
        if (expandedSeparators.has(separatorId)) {
            return true;
        }
    }

    return false;
}


function updateBlockedEdge(childId) {
    if (!showBlockedRelations) {
        return;
    }

    const node = nodes.get(childId);

    if (!node) {
        return;
    }

    const blockedEdges = edges.get({
        filter: function(edge) {
            return (
                edge.type === "blocked"
                &&
                edge.from === childId
            );
        }
    });

    blockedEdges.forEach(
        edge => {
            edges.update({
                id: edge.id,
                hidden: Boolean(node.hidden)
            });
        }
    );
}


function revealSeparator(separatorId) {
    if (pureSeparatorNodes.has(separatorId)) {
        nodes.update({
            id: separatorId,
            hidden: false
        });
    }
}


function hideSeparatorIfUnused(separatorId) {
    if (!pureSeparatorNodes.has(separatorId)) {
        return;
    }

    if (expandedSeparators.has(separatorId)) {
        return;
    }

    nodes.update({
        id: separatorId,
        hidden: true
    });
}


function expand(separatorId) {
    const children =
        childrenBySeparator[separatorId];

    if (!children) {
        return;
    }

    revealSeparator(separatorId);
    expandedSeparators.add(separatorId);

    children.forEach(
        childId => {
            if (collapsibleNodes.has(childId)) {
                nodes.update({
                    id: childId,
                    hidden: false
                });
            }

            const motifEdges = edges.get({
                filter: function(edge) {
                    return (
                        edge.type === "motif"
                        &&
                        edge.from === childId
                        &&
                        edge.to === separatorId
                    );
                }
            });

            motifEdges.forEach(
                edge => {
                    edges.update({
                        id: edge.id,
                        hidden: false
                    });
                }
            );

            updateBlockedEdge(childId);
        }
    );

    updateStatus();
}


function collapse(separatorId) {
    const children =
        childrenBySeparator[separatorId];

    if (!children) {
        return;
    }

    expandedSeparators.delete(separatorId);

    children.forEach(
        childId => {
            const motifEdges = edges.get({
                filter: function(edge) {
                    return (
                        edge.type === "motif"
                        &&
                        edge.from === childId
                        &&
                        edge.to === separatorId
                    );
                }
            });

            motifEdges.forEach(
                edge => {
                    edges.update({
                        id: edge.id,
                        hidden: true
                    });
                }
            );

            if (
                collapsibleNodes.has(childId)
                &&
                !childStillNeeded(childId)
            ) {
                nodes.update({
                    id: childId,
                    hidden: true
                });
            }

            updateBlockedEdge(childId);
        }
    );

    hideSeparatorIfUnused(separatorId);
    updateStatus();
}


function toggleSeparator(separatorId) {
    if (expandedSeparators.has(separatorId)) {
        collapse(separatorId);
    } else {
        expand(separatorId);
    }
}


function updateStatus() {
    statusElement.textContent =
        "Expanded separators: "
        + expandedSeparators.size;
}


network.on(
    "click",
    function(params) {
        if (params.nodes.length !== 1) {
            return;
        }

        const id = params.nodes[0];

        if (
            !Object.prototype.hasOwnProperty.call(
                childrenBySeparator,
                id
            )
        ) {
            return;
        }

        toggleSeparator(id);
    }
);

    .getElementById("collapseAll")
    .addEventListener(
        "click",
        function() {
            const expanded =
                Array.from(expandedSeparators);

            expanded.forEach(
                separatorId => {
                    collapse(separatorId);
                }
            );

            network.fit({
                animation: true
            });
        }
    );

    .getElementById("expandAll")
    .addEventListener(
        "click",
        function() {
            Object.keys(
                childrenBySeparator
            ).forEach(
                separatorId => {
                    expand(separatorId);
                }
            );

            network.fit({
                animation: true
            });
        }
    );

    .getElementById("fitGraph")
    .addEventListener(
        "click",
        function() {
            network.fit({
                animation: true
            });
        }
    );

            animation: false
        });
